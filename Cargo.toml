[package]
name = "workcircuit"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "An offline GNOME companion for rotating tasks and tracking focused work"
repository = "https://github.com/santunesigor/workcircuit"
homepage = "https://github.com/santunesigor/workcircuit"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:adw", "dep:gtk", "dep:zbus", "dep:gdk-x11", "dep:x11rb"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"], optional = true }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"], optional = true }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"], optional = true }

gdk-x11 = { package = "gdk4-x11", version = "0.11", optional = true }
x11rb = { version = "0.14", optional = true }

[[bin]]
name = "workcircuit"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
debug = 0

[profile.test]
debug = 0
